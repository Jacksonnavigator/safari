services:
  - type: web
    name: safari-vision-quest
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    branch: main
    autoDeploy: true
    instanceType: starter
    instanceCount: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: EXAMPLE_API_KEY
        value: ""
    healthCheckPath: /
    healthCheckIntervalSeconds: 10
